---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: industrial-iot
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-workflows
      version: "0.*"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: flux-system
      interval: 12h
  values:
    singleNamespace: true
    workflow:
      serviceAccount:
        create: true
        name: argo-workflow
    controller:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
    server:
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 250m
      service:
        type: NodePort
        nodePortHttp: 30500
