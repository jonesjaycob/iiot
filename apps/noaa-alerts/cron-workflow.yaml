---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: noaa-critical-alerts
  namespace: industrial-iot
  labels:
    app: noaa-alerts
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  workflowSpec:
    entrypoint: noaa-alerts-pipeline
    serviceAccountName: argo-workflow
    templates:
      - name: noaa-alerts-pipeline
        container:
          image: apache/spark:3.5.4-python3
          command:
            - /opt/spark/bin/spark-submit
            - --master
            - local[*]
            - --packages
            - org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.4
            - /scripts/noaa_alerts.py
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: spark-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spark-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: "http://minio.industrial-iot.svc.cluster.local:9000"
            - name: OUTPUT_PATH
              value: "s3a://process-archive/noaa-alerts/"
            - name: KAFKA_BOOTSTRAP
              value: "automq-broker.industrial-iot.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "noaa-critical-alerts"
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 2
        volumes:
          - name: script
            configMap:
              name: noaa-alerts-script
